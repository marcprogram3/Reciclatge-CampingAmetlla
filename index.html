<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guia de reciclatge del Camping Ametlla: informació professional i mapa interactiu per a una gestió sostenible dels residus.">
    <meta name="author" content="Camping Ametlla">
    <title>Reciclatge - Camping Ametlla</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet (mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Estils personalitzats -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-gray-50">

    <!-- CONTENIDORS PER COMPONENTS -->
    <div id="header"></div>
    
    <main class="container mx-auto py-16 px-6" style="margin-top: 100vh;">
        <div id="home"></div>
        <div id="search"></div>
        <div id="map"></div>
        <div id="help"></div>
        <div id="process"></div>
        <div id="contact"></div>
    </main>
    
    <div id="footer"></div>

    <!-- MODAL PER AMPLIAR IMATGES -->
    <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50" onclick="closeModal(event)">
        <div class="bg-white p-6 rounded-lg max-w-4xl mx-auto" onclick="event.stopPropagation()">
            <div class="flex justify-end">
                <button onclick="closeModal(event)" class="text-3xl font-bold text-gray-600 hover:text-gray-900">&times;</button>
            </div>
            <img id="modalImage" src="" alt="Imatge ampliada" class="w-full max-h-[80vh] object-contain">
            <p id="modalCaption" class="text-center text-gray-700 mt-4"></p>
        </div>
    </div>

    <!-- MAIN.JS -->
    <script src="js/main.js"></script>
    
    <!-- CARREGAR COMPONENTS DINÀMICAMENT -->
    <script>
        // Funció per carregar components de manera segura
        function carregarComponent(id, url, callback) {
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.text();
                })
                .then(html => {
                    document.getElementById(id).innerHTML = html;
                    if (callback) callback();
                    console.log(`✅ Component carregat: ${url}`);
                })
                .catch(error => console.error(`❌ Error carregant ${url}:`, error));
        }
        
        // Carregar tots els components
        carregarComponent('header', 'components/header.html');
        carregarComponent('home', 'components/home.html');
        carregarComponent('search', 'components/search.html', function() {
            console.log("🔍 Component de cerca carregat, connectant events...");
            if (window.connectSearchEvents) window.connectSearchEvents();
        });
        carregarComponent('map', 'components/map.html', function() {
            console.log("🗺️ Component mapa carregat, inicialitzant...");
            if (typeof initMap === 'function') setTimeout(initMap, 200);
        });
        carregarComponent('help', 'components/help.html', function() {
            console.log("🌐 Component ajuda carregat, inicialitzant selector...");
            if (typeof initLanguageSelector === 'function') initLanguageSelector();
        });
        carregarComponent('process', 'components/process.html');
        carregarComponent('contact', 'components/contact.html');
        carregarComponent('footer', 'components/footer.html');
    </script>
</body>
</html>
